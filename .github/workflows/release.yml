name: Release (public builder)

# This workflow lives in everyai-com/AIOS_Desktop-releases (PUBLIC repo).
# Source code lives in everyai-com/AIOS_Desktop (PRIVATE repo).
#
# Triggered by a repository_dispatch from the private repo when a tag is
# pushed there, OR manually via workflow_dispatch. Checks out the private
# source via an SSH deploy key (SOURCE_REPO_SSH_KEY secret), builds all
# three platform installers, and publishes releases here.
#
# Why here: public repos get unlimited GitHub Actions minutes — zero cost
# regardless of how often we ship.

on:
  repository_dispatch:
    types: [release-tag]
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag to build (e.g. v0.13.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.client_payload.tag }}" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo everyai-com/AIOS_Desktop-releases >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping create."
          else
            gh release create "$TAG" \
              --repo everyai-com/AIOS_Desktop-releases \
              --title "${TAG#v}" \
              --notes "Release ${TAG#v}" \
              --draft=false
            echo "Created release $TAG"
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            pyinstallerArch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
            pyinstallerArch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
            pyinstallerArch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.client_payload.tag }}" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up SSH agent (deploy key for private source repo)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}

      - name: Checkout private source at tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone git@github.com:everyai-com/AIOS_Desktop.git source
          cd source
          git fetch --tags origin
          git checkout "${{ steps.tag.outputs.tag }}"
          git rev-parse HEAD

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build tools + sidecar deps
        working-directory: source
        run: |
          pip install pyinstaller
          pip install -r python/requirements.txt

      - name: Install universal2 Python + x86_64 deps (Intel Mac only)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fL --connect-timeout 30 --max-time 180 \
                -o /tmp/python-universal2.pkg \
                https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg; then
              break
            fi
            echo "Python download attempt $attempt failed; retrying..."
            [ "$attempt" = "3" ] && { echo "All 3 attempts failed"; exit 6; }
            sleep $((attempt * 20))
          done
          sudo installer -pkg /tmp/python-universal2.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11
          echo "AIOS_X64_PYTHON=$PY" >> $GITHUB_ENV
          arch -x86_64 $PY -m pip install --upgrade pip
          arch -x86_64 $PY -m pip install pyinstaller
          arch -x86_64 $PY -m pip install -r python/requirements.txt
          arch -x86_64 $PY -m pip uninstall -y Pillow
          mkdir -p /tmp/x86_64-wheels
          arch -x86_64 $PY -m pip download --no-deps --platform=macosx_10_10_x86_64 --python-version=3.11 --implementation=cp --abi=cp311 --only-binary=:all: --dest=/tmp/x86_64-wheels Pillow
          arch -x86_64 $PY -m pip install --no-deps --force-reinstall /tmp/x86_64-wheels/*.whl
          PIL_SO=/Library/Frameworks/Python.framework/Versions/3.11/lib/python3.11/site-packages/PIL/_imaging.cpython-311-darwin.so
          file "$PIL_SO"
          file "$PIL_SO" | grep -q x86_64 || { echo "Pillow _imaging.so is not x86_64 — aborting"; exit 1; }

      - name: Install npm deps
        working-directory: source
        run: npm ci

      - name: Release gate (build + tests + Python sidecar dispatch check)
        working-directory: source
        run: npm run check

      - name: Build Python sidecar
        if: '!(matrix.platform == ''mac'' && matrix.arch == ''x64'')'
        working-directory: source
        env:
          AIOS_PYINSTALLER_TARGET_ARCH: ${{ matrix.pyinstallerArch }}
        run: npm run build:python

      - name: Build Python sidecar (Intel via Rosetta)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        env:
          AIOS_PYINSTALLER_TARGET_ARCH: x86_64
        run: arch -x86_64 "$AIOS_X64_PYTHON" -m PyInstaller --noconfirm --clean build/aios-host.spec

      - name: Bundle modern flac into Mac sidecar (arm64)
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        working-directory: source
        run: |
          set -euo pipefail
          brew install flac
          SRC=$(brew --prefix flac)/bin/flac
          DEST=./dist/aios-host/_internal/speech_recognition/flac-mac
          cp "$SRC" "$DEST"
          chmod +x "$DEST"

      - name: Bundle modern flac into Mac sidecar (Intel)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        run: |
          set -euo pipefail
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          arch -x86_64 /usr/local/bin/brew install flac
          SRC=/usr/local/bin/flac
          DEST=./dist/aios-host/_internal/speech_recognition/flac-mac
          cp "$SRC" "$DEST"
          chmod +x "$DEST"

      - name: Bundle smoke test (every module imports)
        if: matrix.platform != 'mac' || matrix.arch != 'x64'
        working-directory: source
        run: npm run test:bundle

      - name: Bundle smoke test (Intel via Rosetta)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        run: arch -x86_64 ./dist/aios-host/aios-host --smoke-import

      - name: Publish (Windows)
        if: matrix.platform == 'win'
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          npm run build
          npx electron-builder --win --publish always

      - name: Publish (macOS arm64)
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build
          npx electron-builder --mac --arm64 --publish always

      - name: Publish (macOS x64 / Intel)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build
          npx electron-builder --mac --x64 --publish always

      - name: Upload installer artifacts (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            source/release/*.exe
            source/release/*.dmg
            source/release/latest*.yml
          if-no-files-found: ignore

  fix-mac-manifest:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.client_payload.tag }}" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi
      - name: Merge Mac manifest with both arches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          REPO="everyai-com/AIOS_Desktop-releases"
          cd /tmp
          ARM64_ZIP="AIOS-Desktop-${VERSION}-arm64-mac.zip"
          INTEL_ZIP="AIOS-Desktop-${VERSION}-mac.zip"
          gh release download "$TAG" --repo "$REPO" -p "$ARM64_ZIP" || { echo "::warning::arm64 zip missing, skipping merge"; exit 0; }
          gh release download "$TAG" --repo "$REPO" -p "$INTEL_ZIP" || { echo "::warning::intel zip missing, skipping merge"; exit 0; }
          ARM64_HASH=$(openssl dgst -sha512 -binary "$ARM64_ZIP" | openssl base64 -A)
          INTEL_HASH=$(openssl dgst -sha512 -binary "$INTEL_ZIP" | openssl base64 -A)
          ARM64_SIZE=$(stat -c%s "$ARM64_ZIP")
          INTEL_SIZE=$(stat -c%s "$INTEL_ZIP")
          RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          cat > latest-mac.yml <<EOF
          version: ${VERSION}
          files:
            - url: ${ARM64_ZIP}
              sha512: ${ARM64_HASH}
              size: ${ARM64_SIZE}
            - url: ${INTEL_ZIP}
              sha512: ${INTEL_HASH}
              size: ${INTEL_SIZE}
          path: ${ARM64_ZIP}
          sha512: ${ARM64_HASH}
          releaseDate: '${RELEASE_DATE}'
          EOF
          echo "--- merged latest-mac.yml ---"
          cat latest-mac.yml
          gh release upload "$TAG" latest-mac.yml --clobber --repo "$REPO"
