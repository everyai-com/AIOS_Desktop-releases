name: Release (dispatched from private source)

# This workflow lives in everyai-com/AIOS_Desktop-releases (public).
# Source code lives in everyai-com/AIOS_Desktop (private). When a tag is
# pushed to the source repo, a tiny dispatcher workflow there sends a
# `release-tag` repository_dispatch event here with the tag name as
# payload. We check out the source via an SSH deploy key, then run the
# full build + publish flow.
#
# Why this split: public repos get unlimited GitHub Actions minutes; the
# build runs here so it's free regardless of how often we ship.

on:
  repository_dispatch:
    types: [release-tag]
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag to build (e.g. v0.2.49)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            pyinstallerArch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
            pyinstallerArch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
            pyinstallerArch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve source tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.client_payload.tag }}" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up SSH agent (deploy key for private source)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}

      - name: Checkout source from private repo at tag
        shell: bash
        run: |
          set -euo pipefail
          # Disable host key prompts; add github.com to known_hosts so
          # the clone doesn't fail with "Host key verification failed".
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone git@github.com:everyai-com/AIOS_Desktop.git source
          cd source
          git fetch --tags origin
          git checkout "${{ steps.tag.outputs.tag }}"
          git rev-parse HEAD

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build tools + sidecar deps
        working-directory: source
        run: |
          pip install pyinstaller
          pip install -r python/requirements.txt

      - name: Install universal2 Python + x86_64 deps (Intel Mac only)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        run: |
          set -euo pipefail
          curl -L -o /tmp/python-universal2.pkg https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg /tmp/python-universal2.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11
          echo "AIOS_X64_PYTHON=$PY" >> $GITHUB_ENV
          arch -x86_64 $PY -m pip install --upgrade pip
          arch -x86_64 $PY -m pip install pyinstaller
          arch -x86_64 $PY -m pip install -r python/requirements.txt
          arch -x86_64 $PY -m pip uninstall -y Pillow
          mkdir -p /tmp/x86_64-wheels
          arch -x86_64 $PY -m pip download --no-deps --platform=macosx_10_10_x86_64 --python-version=3.11 --implementation=cp --abi=cp311 --only-binary=:all: --dest=/tmp/x86_64-wheels Pillow
          arch -x86_64 $PY -m pip install --no-deps --force-reinstall /tmp/x86_64-wheels/*.whl
          PIL_SO=/Library/Frameworks/Python.framework/Versions/3.11/lib/python3.11/site-packages/PIL/_imaging.cpython-311-darwin.so
          file "$PIL_SO"
          file "$PIL_SO" | grep -q x86_64 || { echo "Pillow _imaging.so is not x86_64 — aborting"; exit 1; }

      - name: Install npm deps
        working-directory: source
        run: npm ci

      - name: Release gate (build + tests + Python sidecar dispatch check)
        working-directory: source
        run: npm run check

      - name: Build Python sidecar
        if: '!(matrix.platform == ''mac'' && matrix.arch == ''x64'')'
        working-directory: source
        env:
          AIOS_PYINSTALLER_TARGET_ARCH: ${{ matrix.pyinstallerArch }}
        run: npm run build:python

      - name: Build Python sidecar (Intel via Rosetta)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        env:
          AIOS_PYINSTALLER_TARGET_ARCH: x86_64
        run: arch -x86_64 "$AIOS_X64_PYTHON" -m PyInstaller --noconfirm --clean build/aios-host.spec

      - name: Bundle modern flac into Mac sidecar (arm64)
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        working-directory: source
        run: |
          set -euo pipefail
          brew install flac
          SRC=$(brew --prefix flac)/bin/flac
          DEST=./dist/aios-host/_internal/speech_recognition/flac-mac
          cp "$SRC" "$DEST"
          chmod +x "$DEST"

      - name: Bundle modern flac into Mac sidecar (Intel)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        run: |
          set -euo pipefail
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          arch -x86_64 /usr/local/bin/brew install flac
          SRC=/usr/local/bin/flac
          DEST=./dist/aios-host/_internal/speech_recognition/flac-mac
          cp "$SRC" "$DEST"
          chmod +x "$DEST"

      - name: Bundle smoke test (every module imports)
        if: matrix.platform != 'mac' || matrix.arch != 'x64'
        working-directory: source
        run: npm run test:bundle

      - name: Bundle smoke test (Intel via Rosetta)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        run: arch -x86_64 ./dist/aios-host/aios-host --smoke-import

      # ─────────────────────────────────────────────────────────────────
      # Build artifact LOCALLY (--publish never). The pre-publish verifier
      # then runs against this file. If green → publish step uploads it.
      # If red → release never publishes. Catches packaging bugs before
      # users see them. See AIOS_Desktop_Verifier for the harness.
      # ─────────────────────────────────────────────────────────────────

      # NOTE: the `release:no-python` npm script ends in `electron-builder
      # --publish always`, so `npm run ... -- --publish never` produces
      # `--publish always --publish never`. yargs uses the last value
      # (never) for the CLI flag, but electron-builder still constructs
      # GitHubPublisher during the post-build cleanup and crashes if
      # GH_TOKEN is missing. Passing GH_TOKEN here is a no-op for
      # publishing (--publish never wins) but satisfies the publisher
      # constructor so the step doesn't crash. Real publish happens
      # later in the explicit publish step.
      - name: Build (no publish, Windows)
        if: matrix.platform == 'win'
        working-directory: source
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:no-python -- --win --publish never

      - name: Build (no publish, macOS arm64)
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        working-directory: source
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:no-python -- --mac --arm64 --publish never

      - name: Build (no publish, macOS x64 / Intel)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:no-python -- --mac --x64 --publish never

      # ─────────────────────────────────────────────────────────────────
      # PRE-PUBLISH VERIFIER GATE
      # Clones the public verifier repo, runs probes against the just-built
      # artifact (preflight + smoke-launch-chat + sentry-init). Currently
      # mac-only — Windows verifier path is wired but probe runtime on the
      # Windows runner has unresolved flakiness; skip there until phase 2.
      # ─────────────────────────────────────────────────────────────────

      - name: Checkout verifier
        if: matrix.platform == 'mac'
        uses: actions/checkout@v4
        with:
          repository: everyai-com/AIOS_Desktop_Verifier
          path: verifier

      - name: Setup verifier deps
        if: matrix.platform == 'mac'
        working-directory: verifier
        run: |
          npm ci
          npx playwright install chromium

      - name: Locate built DMG (macOS)
        if: matrix.platform == 'mac'
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find source/release -maxdepth 2 -type f -name "*${{ matrix.arch }}.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No matching .dmg found in source/release for arch ${{ matrix.arch }}"
            ls -la source/release/ || true
            exit 1
          fi
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "Found built artifact: $DMG"

      - name: Pre-publish verify (macOS only)
        if: matrix.platform == 'mac'
        working-directory: verifier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tsx run-local.ts \
            --tag "${{ steps.tag.outputs.tag }}-prepublish-${{ matrix.arch }}" \
            --platform darwin \
            --artifact "${{ github.workspace }}/${{ steps.locate.outputs.path }}" \
            --reports-dir "${{ github.workspace }}/prepublish-reports"

      - name: Upload pre-publish report (on success or failure)
        if: matrix.platform == 'mac' && always()
        uses: actions/upload-artifact@v4
        with:
          name: prepublish-report-${{ matrix.arch }}-${{ steps.tag.outputs.tag }}
          path: prepublish-reports/
          if-no-files-found: warn

      # ─────────────────────────────────────────────────────────────────
      # PUBLISH (only runs if pre-publish verify succeeded above, because
      # the verifier step has no continue-on-error and a failure halts the
      # job). On Windows the publish runs unconditionally for now.
      # ─────────────────────────────────────────────────────────────────

      - name: Publish (Windows)
        if: matrix.platform == 'win'
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run release:no-python -- --win --publish always

      - name: Publish (macOS arm64)
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run release:no-python -- --mac --arm64 --publish always

      - name: Publish (macOS x64 / Intel)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run release:no-python -- --mac --x64 --publish always

      - name: Upload installer artifacts (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            source/release/*.exe
            source/release/*.dmg
            source/release/latest*.yml
          if-no-files-found: ignore
