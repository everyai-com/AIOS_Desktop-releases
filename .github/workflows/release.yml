name: Release (public builder)

# This workflow lives in everyai-com/AIOS_Desktop-releases (PUBLIC repo).
# Source code lives in everyai-com/AIOS_Desktop (PRIVATE repo).
#
# Triggered by a repository_dispatch from the private repo when a tag is
# pushed there, OR manually via workflow_dispatch. Checks out the private
# source via an SSH deploy key (SOURCE_REPO_SSH_KEY secret), builds all
# three platform installers, and publishes releases here.
#
# Why here: public repos get unlimited GitHub Actions minutes — zero cost
# regardless of how often we ship.

on:
  repository_dispatch:
    types: [release-tag]
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag to build (e.g. v0.13.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.client_payload.tag }}" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PRERELEASE_FLAG=""
          case "$TAG" in *-beta*|*-rc*|*-alpha*) PRERELEASE_FLAG="--prerelease" ;; esac
          if gh release view "$TAG" --repo everyai-com/AIOS_Desktop-releases >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping create."
          else
            gh release create "$TAG" \
              --repo everyai-com/AIOS_Desktop-releases \
              --title "${TAG#v}" \
              --notes "Release ${TAG#v}" \
              --draft $PRERELEASE_FLAG
            echo "Created draft release $TAG (prerelease: ${PRERELEASE_FLAG:-no})"
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            pyinstallerArch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
            pyinstallerArch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
            pyinstallerArch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.client_payload.tag }}" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up SSH agent (deploy key for private source repo)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}

      - name: Checkout private source at tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone git@github.com:everyai-com/AIOS_Desktop.git source
          cd source
          git fetch --tags origin
          git checkout "${{ steps.tag.outputs.tag }}"
          git rev-parse HEAD

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build tools + sidecar deps
        working-directory: source
        run: |
          pip install pyinstaller
          pip install -r python/requirements.txt

      - name: Install universal2 Python + x86_64 deps (Intel Mac only)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fL --connect-timeout 30 --max-time 180 \
                -o /tmp/python-universal2.pkg \
                https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg; then
              break
            fi
            echo "Python download attempt $attempt failed; retrying..."
            [ "$attempt" = "3" ] && { echo "All 3 attempts failed"; exit 6; }
            sleep $((attempt * 20))
          done
          sudo installer -pkg /tmp/python-universal2.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11
          echo "AIOS_X64_PYTHON=$PY" >> $GITHUB_ENV
          arch -x86_64 $PY -m pip install --upgrade pip
          arch -x86_64 $PY -m pip install pyinstaller
          arch -x86_64 $PY -m pip install -r python/requirements.txt
          arch -x86_64 $PY -m pip uninstall -y Pillow
          mkdir -p /tmp/x86_64-wheels
          arch -x86_64 $PY -m pip download --no-deps --platform=macosx_10_10_x86_64 --python-version=3.11 --implementation=cp --abi=cp311 --only-binary=:all: --dest=/tmp/x86_64-wheels Pillow
          arch -x86_64 $PY -m pip install --no-deps --force-reinstall /tmp/x86_64-wheels/*.whl
          PIL_SO=/Library/Frameworks/Python.framework/Versions/3.11/lib/python3.11/site-packages/PIL/_imaging.cpython-311-darwin.so
          file "$PIL_SO"
          file "$PIL_SO" | grep -q x86_64 || { echo "Pillow _imaging.so is not x86_64 — aborting"; exit 1; }

      - name: Install npm deps
        working-directory: source
        run: npm ci

      - name: Release gate (build + tests + Python sidecar dispatch check)
        working-directory: source
        run: npm run check

      - name: Build Python sidecar
        if: '!(matrix.platform == ''mac'' && matrix.arch == ''x64'')'
        working-directory: source
        env:
          AIOS_PYINSTALLER_TARGET_ARCH: ${{ matrix.pyinstallerArch }}
        run: npm run build:python

      - name: Build Python sidecar (Intel via Rosetta)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        env:
          AIOS_PYINSTALLER_TARGET_ARCH: x86_64
        run: arch -x86_64 "$AIOS_X64_PYTHON" -m PyInstaller --noconfirm --clean build/aios-host.spec

      - name: Bundle modern flac into Mac sidecar (arm64)
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        working-directory: source
        run: |
          set -euo pipefail
          brew install flac
          SRC=$(brew --prefix flac)/bin/flac
          DEST=./dist/aios-host/_internal/speech_recognition/flac-mac
          cp "$SRC" "$DEST"
          chmod +x "$DEST"

      - name: Bundle modern flac into Mac sidecar (Intel)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        run: |
          set -euo pipefail
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          arch -x86_64 /usr/local/bin/brew install flac
          SRC=/usr/local/bin/flac
          DEST=./dist/aios-host/_internal/speech_recognition/flac-mac
          cp "$SRC" "$DEST"
          chmod +x "$DEST"

      - name: Bundle smoke test (every module imports)
        if: matrix.platform != 'mac' || matrix.arch != 'x64'
        working-directory: source
        run: npm run test:bundle

      - name: Bundle smoke test (Intel via Rosetta)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        run: arch -x86_64 ./dist/aios-host/aios-host --smoke-import

      - name: Select Windows signing mode
        id: windows-signing-mode
        if: matrix.platform == 'win'
        shell: bash
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          ES_PUBLISHER_NAME: ${{ vars.ES_PUBLISHER_NAME }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: |
          set -euo pipefail

          ESIGNER_VALUES=(
            "${ES_USERNAME:-}"
            "${ES_PASSWORD:-}"
            "${ES_TOTP_SECRET:-}"
            "${ES_PUBLISHER_NAME:-}"
          )
          AZURE_VALUES=(
            "${AZURE_TENANT_ID:-}"
            "${AZURE_CLIENT_ID:-}"
            "${AZURE_CLIENT_SECRET:-}"
            "${AZURE_CODE_SIGNING_ENDPOINT:-}"
            "${AZURE_CERTIFICATE_PROFILE_NAME:-}"
            "${AZURE_CODE_SIGNING_ACCOUNT_NAME:-}"
            "${AZURE_PUBLISHER_NAME:-}"
          )
          ESIGNER_SET=0
          for VALUE in "${ESIGNER_VALUES[@]}"; do
            if [ -n "$VALUE" ]; then ESIGNER_SET=$((ESIGNER_SET + 1)); fi
          done
          AZURE_SET=0
          for VALUE in "${AZURE_VALUES[@]}"; do
            if [ -n "$VALUE" ]; then AZURE_SET=$((AZURE_SET + 1)); fi
          done
          PFX_SET=0
          if [ -n "${CSC_LINK:-}" ]; then PFX_SET=$((PFX_SET + 1)); fi
          if [ -n "${CSC_KEY_PASSWORD:-}" ]; then PFX_SET=$((PFX_SET + 1)); fi

          if [ "$ESIGNER_SET" -ne 0 ] && [ "$ESIGNER_SET" -ne "${#ESIGNER_VALUES[@]}" ]; then
            echo "::error::SSL.com eSigner is partially configured; all three ES_* secrets and ES_PUBLISHER_NAME are required."
            exit 1
          fi
          if [ "$AZURE_SET" -ne 0 ] && [ "$AZURE_SET" -ne "${#AZURE_VALUES[@]}" ]; then
            echo "::error::Azure Trusted Signing is partially configured; all three AZURE_* secrets and all four AZURE_* repository variables are required."
            exit 1
          fi
          if [ "$PFX_SET" -eq 1 ]; then
            echo "::error::PFX signing is partially configured; both WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD are required."
            exit 1
          fi

          COMPLETE_MODES=0
          SIGNING_MODE=""
          if [ "$ESIGNER_SET" -eq "${#ESIGNER_VALUES[@]}" ]; then
            COMPLETE_MODES=$((COMPLETE_MODES + 1))
            SIGNING_MODE="esigner"
          fi
          if [ "$AZURE_SET" -eq "${#AZURE_VALUES[@]}" ]; then
            COMPLETE_MODES=$((COMPLETE_MODES + 1))
            SIGNING_MODE="azure"
          fi
          if [ "$PFX_SET" -eq 2 ]; then
            COMPLETE_MODES=$((COMPLETE_MODES + 1))
            SIGNING_MODE="pfx"
          fi

          if [ "$COMPLETE_MODES" -eq 0 ]; then
            echo "::error::No trusted Windows signing identity is configured; refusing to build an unsigned public release."
            exit 1
          fi
          if [ "$COMPLETE_MODES" -ne 1 ]; then
            echo "::error::Multiple Windows signing modes are configured; select exactly one publisher identity."
            exit 1
          fi

          echo "mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"
          echo "Selected $SIGNING_MODE signing."

      # eSigner CKA exposes the cloud-HSM certificate through the CurrentUser
      # Windows certificate store, where electron-builder's normal signtool
      # integration can select it by its exact SHA-1 thumbprint.
      - name: Prepare SSL.com eSigner CKA
        if: matrix.platform == 'win' && steps.windows-signing-mode.outputs.mode == 'esigner'
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          ES_PUBLISHER_NAME: ${{ vars.ES_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"
          Write-Output "::add-mask::$env:ES_USERNAME"
          Write-Output "::add-mask::$env:ES_PASSWORD"
          Write-Output "::add-mask::$env:ES_TOTP_SECRET"

          $archive = Join-Path $env:RUNNER_TEMP "SSL.COM-eSigner-CKA_1.0.7.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "esigner-setup"
          $installDir = Join-Path $env:RUNNER_TEMP "eSignerCKA"
          $masterKey = Join-Path $installDir "master.key"
          $expectedSha256 = "0f40f0ef0aa5c7d73b2d854ec0d2f2be551a6bbbd99cbbd886f7d3ef77c3327c"
          $downloadUrl = "https://github.com/SSLcom/eSignerCKA/releases/download/v1.0.7/SSL.COM-eSigner-CKA_1.0.7.zip"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "eSigner CKA archive checksum mismatch"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded -Force
          $installers = @(
            Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter "*.exe"
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one eSigner CKA installer; found $($installers.Count)"
          }

          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $installerProcess = Start-Process -FilePath $installers[0].FullName `
            -ArgumentList @("/CURRENTUSER", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=$installDir") `
            -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "eSigner CKA installer failed with exit code $($installerProcess.ExitCode)"
          }

          $tool = Join-Path $installDir "eSignerCKATool.exe"
          if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) {
            throw "eSigner CKA command-line tool was not installed"
          }
          & $tool config -mode "product" -user $env:ES_USERNAME -pass $env:ES_PASSWORD `
            -totp $env:ES_TOTP_SECRET -key $masterKey -r | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "eSigner CKA account configuration failed"
          }
          & $tool unload | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "eSigner CKA certificate unload failed"
          }
          & $tool load | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "eSigner CKA certificate load failed"
          }

          $certificates = @(
            Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert |
              Where-Object {
                $_.HasPrivateKey -and
                $_.NotAfter -gt (Get-Date) -and
                $_.GetNameInfo(
                  [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
                  $false
                ) -eq $env:ES_PUBLISHER_NAME
              }
          )
          if ($certificates.Count -ne 1) {
            throw "Expected exactly one usable eSigner certificate for ES_PUBLISHER_NAME; found $($certificates.Count)"
          }
          "ESIGNER_CERT_THUMBPRINT=$($certificates[0].Thumbprint)" >> $env:GITHUB_ENV
          "ESIGNER_PUBLISHER_DN=$($certificates[0].Subject)" >> $env:GITHUB_ENV
          Write-Host "Loaded one expected eSigner code-signing certificate."

      # Windows is deliberately built without electron-builder publishing.
      # The build log says "signing with signtool.exe" even when CSC_LINK is
      # empty, so publication must happen only after PowerShell proves that the
      # final PE files carry one trusted, timestamped Authenticode identity.
      - name: Build Windows installers without publishing
        id: windows-build
        if: matrix.platform == 'win'
        working-directory: source
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: |
          set -euo pipefail

          BUILD_ARGS=(--win --publish never "-c.forceCodeSigning=true")
          case "${{ steps.tag.outputs.tag }}" in
            *-beta*|*-rc*|*-alpha*)
              BUILD_ARGS+=("-c.publish.releaseType=prerelease" "-c.publish.channel=beta")
              ;;
          esac
          if [ "${{ steps.windows-signing-mode.outputs.mode }}" = "azure" ]; then
            BUILD_ARGS+=(
              "-c.win.azureSignOptions.endpoint=${AZURE_CODE_SIGNING_ENDPOINT}"
              "-c.win.azureSignOptions.certificateProfileName=${AZURE_CERTIFICATE_PROFILE_NAME}"
              "-c.win.azureSignOptions.codeSigningAccountName=${AZURE_CODE_SIGNING_ACCOUNT_NAME}"
              "-c.win.azureSignOptions.publisherName=${AZURE_PUBLISHER_NAME}"
            )
          elif [ "${{ steps.windows-signing-mode.outputs.mode }}" = "esigner" ]; then
            BUILD_ARGS+=(
              "-c.win.signtoolOptions.certificateSha1=${ESIGNER_CERT_THUMBPRINT}"
              "-c.win.signtoolOptions.publisherName=${ESIGNER_PUBLISHER_DN}"
              "-c.win.signtoolOptions.rfc3161TimeStampServer=http://ts.ssl.com"
            )
          fi

          echo "mode=${{ steps.windows-signing-mode.outputs.mode }}" >> "$GITHUB_OUTPUT"
          echo "Building Windows release with ${{ steps.windows-signing-mode.outputs.mode }} signing."
          npm run build
          npx electron-builder "${BUILD_ARGS[@]}"

      - name: Verify Windows Authenticode and updater manifest
        id: windows-signature
        if: matrix.platform == 'win'
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.tag.outputs.tag }}" -replace "^v", ""
          $installer = "release\AIOS Desktop Setup $version.exe"
          $targets = @(
            "release\win-unpacked\AIOS Desktop.exe",
            "release\win-unpacked\resources\aios-host\aios-host.exe",
            "release\win-unpacked\resources\aios-host\_internal\speech_recognition\flac-win32.exe",
            "release\win-unpacked\resources\elevate.exe",
            $installer
          )

          $signerThumbprint = $null
          foreach ($target in $targets) {
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "Expected signed Windows executable is missing: $target"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Authenticode is not trusted for $target (status: $($signature.Status); $($signature.StatusMessage))"
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "Authenticode signer certificate is missing for $target"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "RFC3161 timestamp certificate is missing for $target"
            }
            if ($null -eq $signerThumbprint) {
              $signerThumbprint = $signature.SignerCertificate.Thumbprint
            } elseif ($signature.SignerCertificate.Thumbprint -ne $signerThumbprint) {
              throw "Windows executables were not signed by one consistent publisher"
            }
            Write-Host "Verified $target"
            Write-Host "  signer: $($signature.SignerCertificate.Subject)"
            Write-Host "  timestamp: $($signature.TimeStamperCertificate.Subject)"
          }
          if ("${{ steps.windows-signing-mode.outputs.mode }}" -eq "esigner") {
            if ($signerThumbprint -ne $env:ESIGNER_CERT_THUMBPRINT) {
              throw "Released executables do not match the selected eSigner certificate"
            }
            $installerSubject = (Get-AuthenticodeSignature -LiteralPath $installer).SignerCertificate.Subject
            if ($installerSubject -ne $env:ESIGNER_PUBLISHER_DN) {
              throw "Released installer publisher does not match the selected eSigner identity"
            }
          }

          $manifestName = if ("${{ steps.tag.outputs.tag }}" -match "-(beta|rc|alpha)") {
            "beta.yml"
          } else {
            "latest.yml"
          }
          $manifestPath = "release\$manifestName"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Windows updater manifest is missing: $manifestPath"
          }
          $publicInstaller = "AIOS-Desktop-Setup-$version.exe"
          $sha512 = [Convert]::ToBase64String(
            [Security.Cryptography.SHA512]::Create().ComputeHash(
              [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $installer))
            )
          )
          $manifest = Get-Content -LiteralPath $manifestPath -Raw
          if (-not $manifest.Contains("path: $publicInstaller")) {
            throw "Updater manifest does not name the verified installer: $publicInstaller"
          }
          if (-not $manifest.Contains("sha512: $sha512")) {
            throw "Updater manifest SHA-512 does not match the verified installer"
          }

          "signer_subject=$((Get-AuthenticodeSignature -LiteralPath $installer).SignerCertificate.Subject)" >> $env:GITHUB_OUTPUT
          "signer_thumbprint=$signerThumbprint" >> $env:GITHUB_OUTPUT
          Write-Host "Windows signature and updater manifest verified."

      - name: Publish verified Windows artifacts
        if: matrix.platform == 'win'
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          REPO="everyai-com/AIOS_Desktop-releases"
          INSTALLER_SOURCE="release/AIOS Desktop Setup ${VERSION}.exe"
          PUBLIC_NAME="AIOS-Desktop-Setup-${VERSION}.exe"
          MANIFEST="release/latest.yml"
          case "$TAG" in *-beta*|*-rc*|*-alpha*) MANIFEST="release/beta.yml" ;; esac
          STAGE="${RUNNER_TEMP}/aios-windows-release"

          test -s "$INSTALLER_SOURCE"
          test -s "$MANIFEST"
          mkdir -p "$STAGE"
          cp "$INSTALLER_SOURCE" "$STAGE/$PUBLIC_NAME"
          cp "$MANIFEST" "$STAGE/$(basename "$MANIFEST")"
          gh release upload "$TAG" \
            "$STAGE/$PUBLIC_NAME" \
            "$STAGE/$(basename "$MANIFEST")" \
            --clobber --repo "$REPO"

          for LOCAL_PATH in "$STAGE/$PUBLIC_NAME" "$STAGE/$(basename "$MANIFEST")"; do
            ASSET_NAME="$(basename "$LOCAL_PATH")"
            LOCAL_DIGEST="sha256:$(sha256sum "$LOCAL_PATH" | awk '{print $1}')"
            REMOTE_DIGEST="$(gh release view "$TAG" --repo "$REPO" --json assets \
              --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .digest")"
            test "$REMOTE_DIGEST" = "$LOCAL_DIGEST"
            echo "Published verified $ASSET_NAME ($REMOTE_DIGEST)"
          done

      - name: Publish (macOS arm64)
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build
          PRERELEASE=""
          case "${{ steps.tag.outputs.tag }}" in *-beta*|*-rc*|*-alpha*) PRERELEASE="-c.publish.releaseType=prerelease -c.publish.channel=beta" ;; esac
          npx electron-builder --mac --arm64 --publish always $PRERELEASE

      - name: Publish (macOS x64 / Intel)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build
          PRERELEASE=""
          case "${{ steps.tag.outputs.tag }}" in *-beta*|*-rc*|*-alpha*) PRERELEASE="-c.publish.releaseType=prerelease -c.publish.channel=beta" ;; esac
          npx electron-builder --mac --x64 --publish always $PRERELEASE

      # electron-builder starts its publish queue before afterAllArtifactBuild
      # finishes notarizing/stapling the DMG. Without this explicit final upload,
      # the release can contain the pre-staple bytes even though the runner log
      # says "The staple and validate action worked." Re-upload the exact
      # post-hook file and prove GitHub stored the same digest.
      - name: Publish final stapled DMG
        if: matrix.platform == 'mac'
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          REPO="everyai-com/AIOS_Desktop-releases"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            LOCAL_DMG="release/AIOS Desktop-${VERSION}-arm64.dmg"
            PUBLIC_NAME="AIOS-Desktop-${VERSION}-arm64.dmg"
          else
            LOCAL_DMG="release/AIOS Desktop-${VERSION}.dmg"
            PUBLIC_NAME="AIOS-Desktop-${VERSION}.dmg"
          fi
          xcrun stapler validate "$LOCAL_DMG"
          cp "$LOCAL_DMG" "/tmp/$PUBLIC_NAME"
          gh release upload "$TAG" "/tmp/$PUBLIC_NAME" --clobber --repo "$REPO"
          LOCAL_DIGEST="sha256:$(shasum -a 256 "/tmp/$PUBLIC_NAME" | awk '{print $1}')"
          REMOTE_DIGEST="$(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq ".assets[] | select(.name == \"$PUBLIC_NAME\") | .digest")"
          test "$REMOTE_DIGEST" = "$LOCAL_DIGEST"
          echo "Published final stapled $PUBLIC_NAME ($REMOTE_DIGEST)"

      - name: Upload installer artifacts (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            source/release/*.exe
            source/release/*.dmg
            source/release/latest*.yml
          if-no-files-found: ignore

  fix-mac-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.client_payload.tag }}" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi
      - name: Merge Mac manifest with both arches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          REPO="everyai-com/AIOS_Desktop-releases"
          cd /tmp
          ARM64_ZIP="AIOS-Desktop-${VERSION}-arm64-mac.zip"
          INTEL_ZIP="AIOS-Desktop-${VERSION}-mac.zip"
          gh release download "$TAG" --repo "$REPO" -p "$ARM64_ZIP" || { echo "::warning::arm64 zip missing, skipping merge"; exit 0; }
          gh release download "$TAG" --repo "$REPO" -p "$INTEL_ZIP" || { echo "::warning::intel zip missing, skipping merge"; exit 0; }
          ARM64_HASH=$(openssl dgst -sha512 -binary "$ARM64_ZIP" | openssl base64 -A)
          INTEL_HASH=$(openssl dgst -sha512 -binary "$INTEL_ZIP" | openssl base64 -A)
          ARM64_SIZE=$(stat -c%s "$ARM64_ZIP")
          INTEL_SIZE=$(stat -c%s "$INTEL_ZIP")
          RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          MANIFEST="latest-mac.yml"
          case "$TAG" in *-beta*|*-rc*|*-alpha*) MANIFEST="beta-mac.yml" ;; esac
          cat > "$MANIFEST" <<EOF
          version: ${VERSION}
          files:
            - url: ${ARM64_ZIP}
              sha512: ${ARM64_HASH}
              size: ${ARM64_SIZE}
            - url: ${INTEL_ZIP}
              sha512: ${INTEL_HASH}
              size: ${INTEL_SIZE}
          path: ${ARM64_ZIP}
          sha512: ${ARM64_HASH}
          releaseDate: '${RELEASE_DATE}'
          EOF
          echo "--- merged $MANIFEST ---"
          cat "$MANIFEST"
          gh release upload "$TAG" "$MANIFEST" --clobber --repo "$REPO"

  finalize-release:
    needs: [build, fix-mac-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.client_payload.tag }}" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Verify complete public asset set and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          REPO="everyai-com/AIOS_Desktop-releases"
          WIN_MANIFEST="latest.yml"
          MAC_MANIFEST="latest-mac.yml"
          case "$TAG" in
            *-beta*|*-rc*|*-alpha*)
              WIN_MANIFEST="beta.yml"
              MAC_MANIFEST="beta-mac.yml"
              ;;
          esac

          REQUIRED_ASSETS=(
            "AIOS-Desktop-${VERSION}-arm64-mac.zip"
            "AIOS-Desktop-${VERSION}-arm64.dmg"
            "AIOS-Desktop-${VERSION}-arm64.dmg.blockmap"
            "AIOS-Desktop-${VERSION}-mac.zip"
            "AIOS-Desktop-${VERSION}.dmg"
            "AIOS-Desktop-${VERSION}.dmg.blockmap"
            "AIOS-Desktop-Setup-${VERSION}.exe"
            "$MAC_MANIFEST"
            "$WIN_MANIFEST"
          )
          ASSETS_JSON="$(gh release view "$TAG" --repo "$REPO" --json assets)"
          for ASSET in "${REQUIRED_ASSETS[@]}"; do
            SIZE="$(jq -r --arg name "$ASSET" \
              '.assets[] | select(.name == $name) | .size' <<<"$ASSETS_JSON")"
            DIGEST="$(jq -r --arg name "$ASSET" \
              '.assets[] | select(.name == $name) | .digest' <<<"$ASSETS_JSON")"
            test -n "$SIZE" && test "$SIZE" -gt 0
            case "$DIGEST" in sha256:*) ;; *) exit 1 ;; esac
            echo "Verified public asset $ASSET ($SIZE bytes, $DIGEST)"
          done

          ZIP_BLOCKMAPS="$(jq -r --arg version "$VERSION" \
            '[.assets[] | select(.name | endswith(".zip.blockmap")) | select(.name | contains($version))] | length' \
            <<<"$ASSETS_JSON")"
          test "$ZIP_BLOCKMAPS" -eq 2

          WORK_DIR="$(mktemp -d)"
          trap 'find "$WORK_DIR" -xdev -depth -delete' EXIT
          gh release download "$TAG" --repo "$REPO" \
            -p "$MAC_MANIFEST" -p "$WIN_MANIFEST" -D "$WORK_DIR"
          grep -Fxq "version: $VERSION" "$WORK_DIR/$MAC_MANIFEST"
          grep -Fxq "version: $VERSION" "$WORK_DIR/$WIN_MANIFEST"
          grep -Fq "AIOS-Desktop-${VERSION}-arm64-mac.zip" "$WORK_DIR/$MAC_MANIFEST"
          grep -Fq "AIOS-Desktop-${VERSION}-mac.zip" "$WORK_DIR/$MAC_MANIFEST"
          grep -Fq "AIOS-Desktop-Setup-${VERSION}.exe" "$WORK_DIR/$WIN_MANIFEST"

          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo "Published complete verified release $TAG."
