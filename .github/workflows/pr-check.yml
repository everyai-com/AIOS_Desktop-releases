name: PR check (public builder)

# This workflow lives in everyai-com/AIOS_Desktop-releases (PUBLIC repo).
# Source code lives in everyai-com/AIOS_Desktop (PRIVATE repo).
#
# The org billing state blocks Actions runners on the private repo, so its
# `check` workflow dies before step 1 on every PR. This mirrors that gate on
# free public minutes: the aios-github-dispatch Cloudflare Worker forwards
# branch pushes here as a repository_dispatch, we run the same two
# `npm run check` legs against the private source, and report the result back
# as commit statuses (contexts `public-check` / `public-check-windows`) via
# the worker's /status proxy so the outcome shows on the private PR.

on:
  repository_dispatch:
    types: [pr-check]
  workflow_dispatch:
    inputs:
      sha:
        description: "Private-repo commit SHA to check"
        required: true
        type: string
      branch:
        description: "Branch name (label only)"
        required: false
        type: string

concurrency:
  group: pr-check-${{ github.event.client_payload.sha || inputs.sha }}
  cancel-in-progress: true

env:
  SRC_SHA: ${{ github.event.client_payload.sha || inputs.sha }}
  SRC_BRANCH: ${{ github.event.client_payload.branch || inputs.branch }}
  STATUS_URL: https://aios-github-dispatch.everyai-com.workers.dev/status
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  check:
    # macOS = the proven recipe for `npm run check` (matches the private
    # check.yml and the release builder's mac legs).
    runs-on: macos-latest
    steps:
      - name: Report pending
        shell: bash
        run: |
          curl -sf -X POST "$STATUS_URL" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_STATUS_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"$SRC_SHA\",\"state\":\"pending\",\"context\":\"public-check\",\"description\":\"npm run check (macOS) running on public builder\",\"target_url\":\"$RUN_URL\"}"
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: everyai-com/AIOS_Desktop
          ref: ${{ env.SRC_SHA }}
          ssh-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install deps
        run: npm ci
      - name: npm run check (build + vitest + python)
        run: npm run check
      - name: Report result
        if: always()
        shell: bash
        run: |
          STATE=failure; [ "${{ job.status }}" = "success" ] && STATE=success
          curl -sf -X POST "$STATUS_URL" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_STATUS_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"$SRC_SHA\",\"state\":\"$STATE\",\"context\":\"public-check\",\"description\":\"npm run check (macOS) on public builder: $STATE\",\"target_url\":\"$RUN_URL\"}"

  check-windows:
    # The release builder runs this same gate on Windows; keeping it on every
    # branch push catches interpreter-selection and file-lock failures before
    # a release tag creates a partial draft release.
    runs-on: windows-latest
    steps:
      - name: Report pending
        shell: bash
        run: |
          curl -sf -X POST "$STATUS_URL" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_STATUS_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"$SRC_SHA\",\"state\":\"pending\",\"context\":\"public-check-windows\",\"description\":\"npm run check (Windows) running on public builder\",\"target_url\":\"$RUN_URL\"}"
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: everyai-com/AIOS_Desktop
          ref: ${{ env.SRC_SHA }}
          ssh-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python sidecar deps
        run: python -m pip install -r python/requirements.txt
      - name: Install deps
        run: npm ci
      - name: npm run check (build + vitest + python)
        run: npm run check
      - name: Report result
        if: always()
        shell: bash
        run: |
          STATE=failure; [ "${{ job.status }}" = "success" ] && STATE=success
          curl -sf -X POST "$STATUS_URL" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_STATUS_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"$SRC_SHA\",\"state\":\"$STATE\",\"context\":\"public-check-windows\",\"description\":\"npm run check (Windows) on public builder: $STATE\",\"target_url\":\"$RUN_URL\"}"
